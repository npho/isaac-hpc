[project]
name = "robotics-isaaclab"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "isaacsim[all,extscache]==6.1.0.0",
    "isaaclab>=3.0.0rc1",
    "rsl-rl-lib",
    "rerun-sdk==0.31.4",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[tool.uv]
prerelease = "allow"
python-preference = "only-managed"
index-strategy = "unsafe-best-match"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'"
]
